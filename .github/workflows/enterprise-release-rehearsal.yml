name: Enterprise release rehearsal
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements-rehearsal.txt
      - run: npm ci
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=moderate
          python -m pip_audit -r requirements-production.lock --no-deps --disable-pip
      - name: Generate temporary credentials and TLS certificates
        run: |
          mkdir -p .local-data
          python -c "import secrets,pathlib; pathlib.Path('.local-data/postgres-test.env').write_text('POSTGRES_TEST_PASSWORD='+secrets.token_hex(24)+'\n')"
          python scripts/create_enterprise_test_certs.py
      - name: Check migration reproducibility
        run: |
          python scripts/generate_enterprise_migration.py
          git diff --exit-code -- scripts/sql/enterprise/001_enterprise.sql
      - name: Start disposable PostgreSQL with TLS
        run: docker compose --env-file .local-data/postgres-test.env -f compose.enterprise-test.yml -p loamy-enterprise-test up -d --wait
      - name: Frontend checks and business-only production build
        env:
          VITE_ENTERPRISE_ENABLED: 'true'
          VITE_ENTERPRISE_ONLY: 'true'
        run: |
          npx eslint src/App.jsx src/BusinessWorkspace.jsx src/WorkspaceVerification.jsx src/WorkspaceFinances.jsx src/WorkspaceOrders.jsx src/WorkspaceInvoice.jsx src/WorkspacePayments.jsx src/WorkspaceExpenses.jsx src/services/workspaceService.js
          npm run build
      - name: Workflow, security-boundary and concurrency checks
        env:
          LOAMY_RUN_POSTGRES_TESTS: '1'
        run: python -m unittest test_workspace_features test_workspace_orders test_workspace_invoices test_workspace_payments test_workspace_expenses test_enterprise_production -v
      - name: Verify backup and restore
        run: python scripts/rehearse_enterprise_restore.py
      - name: Build and smoke-test production container
        run: |
          docker build -f Dockerfile.enterprise -t loamy-enterprise:rehearsal .
          mkdir -p ../output/loamy-study
          python scripts/rehearse_enterprise_container.py
      - name: Remove disposable test database
        if: always()
        run: docker compose --env-file .local-data/postgres-test.env -f compose.enterprise-test.yml -p loamy-enterprise-test down
