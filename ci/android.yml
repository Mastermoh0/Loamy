name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL is not set. Add it under Settings > Secrets and variables > Actions (an https:// backend URL), otherwise the APK falls back to http://127.0.0.1:8000, which is the phone itself."
            exit 1
          fi
          case "$VITE_API_URL" in
            https://*) ;;
            *) echo "::error::VITE_API_URL must start with https:// (the Android WebView blocks http:// calls from its https://localhost origin)."; exit 1 ;;
          esac
          npm run build

      - name: Initialize Capacitor
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init Loamy com.loamy.app --web-dir dist
          else
            echo "Capacitor config already present, skipping cap init"
          fi

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ already present, skipping cap add"
          fi

      - name: Register com.loamy.app deep link
        run: node scripts/android-setup.mjs

      - name: Generate Loamy app icons
        run: npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'

      - name: Sync Capacitor
        run: npx cap sync

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: 21

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: loamy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
